# TEMPORARY - reproduces yt-dlp not finding the app-managed Deno on Linux.
# Deleted before merging. Never publishes anything.
name: Deno lookup repro (temporary)

on:
  push:
    branches: [ "claude/followups" ]

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
    - name: yt-dlp with and without a Deno path
      run: |
        DATA="$RUNNER_TEMP/data"
        mkdir -p "$DATA" && cd "$DATA"
        curl -fsSLo yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
        curl -fsSLo deno.zip https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip
        unzip -q deno.zip && chmod +x yt-dlp deno && rm deno.zip
        echo "system deno on PATH: $(command -v deno || echo none)"
        # Like the app: absolute paths, current directory elsewhere, data folder not on PATH.
        cd "$HOME"
        echo "--- as the app runs it today (no Deno path):"
        "$DATA/yt-dlp" -v 2>&1 | grep "JS runtimes" || true
        echo "--- with --js-runtimes deno:<path>:"
        "$DATA/yt-dlp" -v --js-runtimes "deno:$DATA/deno" 2>&1 | grep "JS runtimes" || true
