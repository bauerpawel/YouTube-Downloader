# TEMPORARY - delete before merging. Builds the app from this branch (same
# publish flags as the release workflow), packs it into the snap and runs the
# snap smoke test: IsSnap and ProcessRunner under strict confinement.
# Never publishes.
name: Snap verify from source (temporary)

on:
  push:
    branches: [ "claude/followups" ]

permissions:
  contents: read

jobs:
  snap:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            rid: linux-x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            rid: linux-arm64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Install .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Publish this branch's single-file binary
      run: |
        dotnet publish YouTubeDownloader.csproj -c Release -r ${{ matrix.rid }} --self-contained true           -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true           -p:EnableCompressionInSingleFile=true -o publish-out
        mkdir -p snap-bin
        cp publish-out/YouTubeDownloader snap-bin/YouTubeDownloader

    - name: Prepare snap-bin (binary + version)
      run: |
        chmod +x snap-bin/YouTubeDownloader
        version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' YouTubeDownloader.csproj)
        echo "${version}-${{ github.run_number }}" > snap-bin/version.txt
        echo "Snap version: $(cat snap-bin/version.txt)"

    - name: Build snap
      id: build
      uses: snapcore/action-build@v1

    # Installs the snap the way a user gets it (strict confinement,
    # auto-connected interfaces) and checks that the app starts and can
    # download AND run its tools from $SNAP_USER_COMMON. Xvfb runs with -ac:
    # xvfb-run keeps its Xauthority file in /tmp, which a snap cannot see
    # (private /tmp). The first start of a snap builds the font cache, hence
    # up to 120 s.
    - name: Smoke-test installed snap
      env:
        YTD_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        sudo snap install gnome-46-2404
        sudo snap install --dangerous "${{ steps.build.outputs.snap }}"
        snap connections yt-downloader-bp
        for plug in home network; do
          if ! snap connections yt-downloader-bp | awk -v p="yt-downloader-bp:$plug" '$2 == p && $3 != "-" { ok = 1 } END { exit !ok }'; then
            echo "Interface '$plug' is not connected"
            exit 1
          fi
        done
        sudo apt-get update
        sudo apt-get install -y xvfb
        Xvfb :99 -screen 0 1280x1024x24 -ac > /dev/null 2>&1 &
        export DISPLAY=:99
        LOG="$RUNNER_TEMP/snap-app.log"
        COMMON="$HOME/snap/yt-downloader-bp/common"
        snap run yt-downloader-bp > "$LOG" 2>&1 &
        APP_PID=$!
        ok=0
        for i in $(seq 1 24); do
          sleep 5
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "The snap app exited or crashed"
            break
          fi
          if [ -x "$COMMON/yt-dlp" ] && [ -x "$COMMON/ffmpeg_bin/ffmpeg" ]; then
            ok=1
            break
          fi
        done
        if [ "$ok" = 1 ]; then
          echo "yt-dlp and ffmpeg were downloaded to $COMMON and are executable"
          # A real download runs these tools inside the app's confinement (yt-dlp
          # is a PyInstaller onefile that unpacks into the snap's private /tmp),
          # reads user-dirs.dirs through the desktop interface and writes the
          # downloads folder through the home interface - do exactly that here,
          # without the GitHub token (third-party binaries).
          mkdir -p "$HOME/.config"
          echo 'XDG_DOWNLOAD_DIR="$HOME/Pobrane"' > "$HOME/.config/user-dirs.dirs"
          if env -u YTD_GITHUB_TOKEN snap run --shell yt-downloader-bp -c '
            set -e
            "$SNAP_USER_COMMON/yt-dlp" --version
            "$SNAP_USER_COMMON/deno" --version
            # yt-dlp must see the Deno of the app, passed the way the app passes it
            "$SNAP_USER_COMMON/yt-dlp" -v --js-runtimes "deno:$SNAP_USER_COMMON/deno" 2>&1 | grep "JS runtimes: deno-"
            "$SNAP_USER_COMMON/ffmpeg_bin/ffmpeg" -version | head -1
            "$SNAP_USER_COMMON/ffmpeg_bin/ffprobe" -version | head -1
            grep XDG_DOWNLOAD_DIR "$SNAP_REAL_HOME/.config/user-dirs.dirs"
            mkdir -p "$SNAP_REAL_HOME/Pobrane/YouTube Downloader"
            touch "$SNAP_REAL_HOME/Pobrane/YouTube Downloader/write-test"
          '; then
            echo "The tools run and the downloads folder is readable and writable under strict confinement"
          else
            echo "Running the tools or using the downloads folder failed under strict confinement"
            ok=0
          fi
        else
          echo "Tools not in $COMMON after 120 s (or the app stopped)"
        fi
        if [ "$ok" != 1 ]; then
          ls -la "$COMMON" "$COMMON/ffmpeg_bin" 2>&1 || true
          cat "$LOG"
          echo "--- AppArmor / seccomp denials:"
          sudo dmesg | grep -E 'apparmor="DENIED"|type=1326' | tail -40 || true
        fi
        pkill -f yt-downloader-bp || true
        sudo snap remove --purge yt-downloader-bp
        [ "$ok" = 1 ]
