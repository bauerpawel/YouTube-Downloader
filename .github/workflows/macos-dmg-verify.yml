# TEMPORARY - remove before merging to main. Builds this branch's macOS installer
# and runs macos/smoke-test.sh on it, without the publish job (which would create
# a real GitHub Release that the self-updater offers to every user). The same
# steps as the release workflow's macOS legs, up to the .dmg smoke test.
name: macOS dmg verify (temporary)

on:
  push:
    branches: [ "claude/macos-dmg" ]

permissions:
  contents: read

jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]

    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Install .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    # No BuildNumber: a local-style build, so the app's self-update stays off.
    - name: Publish Application (${{ matrix.rid }})
      run: |
        dotnet publish YouTubeDownloader.csproj -c Release -r ${{ matrix.rid }} --self-contained true \
          -p:PublishSingleFile=false -o ./publish/${{ matrix.rid }}

    - name: Ad-hoc code-sign (as the release workflow)
      run: |
        chmod +x ./publish/${{ matrix.rid }}/YouTubeDownloader
        codesign --sign - --force --deep ./publish/${{ matrix.rid }}/YouTubeDownloader
        find ./publish/${{ matrix.rid }} -name "*.dylib" -exec codesign --sign - --force {} \;

    - name: Install Rosetta (osx-x64 on ARM64 runner)
      if: matrix.rid == 'osx-x64'
      run: sudo softwareupdate --install-rosetta --agree-to-license

    - name: Build app bundle and .dmg
      run: bash macos/package.sh ./publish/${{ matrix.rid }} ./dist/${{ matrix.rid }} ${{ matrix.rid }} 2.0.0 1

    - name: Smoke-test .dmg
      env:
        YTD_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: bash macos/smoke-test.sh ./dist/${{ matrix.rid }}/YouTubeDownloader-${{ matrix.rid }}.dmg ./dist/${{ matrix.rid }}/YouTubeDownloader-${{ matrix.rid }}-app.zip

    # To try the installer on a real Mac.
    - name: Upload .dmg
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: YouTubeDownloader-${{ matrix.rid }}-dmg
        path: ./dist/${{ matrix.rid }}/YouTubeDownloader-${{ matrix.rid }}.dmg
        if-no-files-found: warn
