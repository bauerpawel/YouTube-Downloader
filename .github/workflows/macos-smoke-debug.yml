# TEMPORARY - diagnoses the macOS smoke-test failure of run 36451352366 without
# creating a GitHub Release (the main workflow's publish job would). Runs only on
# pushes to this debug branch. Delete before merging the branch to main.

name: macOS smoke debug

on:
  push:
    branches: [ "claude/macos-smoke-debug" ]

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-x64, osx-arm64]

    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Publish (${{ matrix.rid }})
      run: |
        dotnet publish YouTubeDownloader.csproj -c Release -r ${{ matrix.rid }} --self-contained true \
          -p:PublishSingleFile=false -p:BuildNumber=${{ github.run_number }} -o ./publish/${{ matrix.rid }}
        chmod +x ./publish/${{ matrix.rid }}/YouTubeDownloader
        codesign --sign - --force --deep ./publish/${{ matrix.rid }}/YouTubeDownloader
        find ./publish/${{ matrix.rid }} -name "*.dylib" -exec codesign --sign - --force {} \;

    - name: Install Rosetta
      if: matrix.rid == 'osx-x64'
      run: sudo softwareupdate --install-rosetta --agree-to-license

    - name: Environment evidence
      run: |
        echo "which deno: $(which deno || echo none)"
        echo "GitHub API rate limit for this runner (unauthenticated):"
        curl -s https://api.github.com/rate_limit | grep -A4 '"core"' || true

    - name: Smoke-test with diagnostics
      run: |
        SMOKE="$RUNNER_TEMP/smoke"
        DATA_DIR="$HOME/Library/Application Support/YouTubeDownloader"
        mkdir -p "$SMOKE"
        cp -R ./publish/${{ matrix.rid }}/. "$SMOKE/"
        chmod +x "$SMOKE/YouTubeDownloader"
        "$SMOKE/YouTubeDownloader" > "$SMOKE/app.log" 2>&1 &
        APP_PID=$!
        for i in $(seq 1 18); do
          sleep 10
          echo "--- t=$((i*10))s alive=$(kill -0 $APP_PID 2>/dev/null && echo yes || echo no) data: $(ls "$DATA_DIR" 2>/dev/null | tr '\n' ' ')"
          if [ -x "$DATA_DIR/yt-dlp" ] && [ -x "$DATA_DIR/ffmpeg_bin/ffmpeg" ] && [ -x "$DATA_DIR/ffmpeg_bin/ffprobe" ]; then break; fi
        done
        echo "=== app.log ==="
        cat "$SMOKE/app.log"
        echo "=== data dir ==="
        ls -la "$DATA_DIR" "$DATA_DIR/ffmpeg_bin" 2>&1 || true
        kill $APP_PID 2>/dev/null || true
        [ -x "$DATA_DIR/yt-dlp" ] && [ -x "$DATA_DIR/ffmpeg_bin/ffmpeg" ] && [ -x "$DATA_DIR/ffmpeg_bin/ffprobe" ]
