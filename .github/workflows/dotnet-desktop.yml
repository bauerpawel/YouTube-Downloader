# This workflow builds and publishes the YouTube Downloader .NET Avalonia application

name: .NET Desktop

permissions:
  actions: write
  contents: write

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  Solution_Name: YouTubeDownloader.csproj

defaults:
  run:
    shell: pwsh

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # Install the .NET 10 workload
    - name: Install .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    # Restore dependencies
    - name: Restore dependencies
      run: dotnet restore $env:Solution_Name

    # Build the application
    - name: Build
      run: dotnet build $env:Solution_Name -c ${{ matrix.configuration }} --no-restore

    # Execute all unit tests in the solution
    - name: Execute unit tests
      run: dotnet test $env:Solution_Name -c ${{ matrix.configuration }} --no-build --verbosity normal
      continue-on-error: true  # Continue if no tests exist

  publish:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'  # not on forked PRs

    strategy:
      max-parallel: 1  # avoid racing when RIDs update the same GitHub Release
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            exeName: YouTubeDownloader.exe
            releaseExeName: YouTubeDownloader-win-x64.exe
            singleFile: true
          - rid: win-arm64
            os: windows-latest
            exeName: YouTubeDownloader.exe
            releaseExeName: YouTubeDownloader-win-arm64.exe
            singleFile: true
          - rid: linux-x64
            os: ubuntu-latest
            exeName: YouTubeDownloader
            releaseExeName: YouTubeDownloader-linux-x64
            singleFile: true
          - rid: linux-arm64
            os: ubuntu-latest
            exeName: YouTubeDownloader
            releaseExeName: YouTubeDownloader-linux-arm64
            singleFile: true
          # macOS does NOT use PublishSingleFile - see the "Publish
          # Application" step's comment for why (a long-standing .NET
          # runtime limitation, reproduced on this project's own CI).
          - rid: osx-x64
            os: macos-latest
            exeName: YouTubeDownloader
            singleFile: false
          - rid: osx-arm64
            os: macos-latest
            exeName: YouTubeDownloader
            singleFile: false

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # Install the .NET 10 workload
    - name: Install .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    # Read the app version from the csproj (single source of truth), so the
    # release tag/name reflect the actual app version instead of being
    # version-blind. Suffixed with the run number (not just the version) so
    # every push still gets its own distinct release, same as before.
    - name: Get app version
      id: get_version
      run: |
        $ver = dotnet msbuild $env:Solution_Name -getProperty:Version
        echo "version=$ver" >> $env:GITHUB_OUTPUT

    # Restore dependencies
    - name: Restore dependencies
      run: dotnet restore $env:Solution_Name

    # Publish the self-contained application for this architecture. Windows/
    # Linux use PublishSingleFile (works reliably there); macOS does not -
    # a long-standing, still-open .NET runtime limitation (dotnet/runtime
    # #49091, #67062, #79267) means native libraries self-extracted from a
    # single-file bundle at *runtime* are unsigned, and native Apple Silicon
    # refuses to load unsigned code - reproduced on this exact CI three times
    # in a row (ad-hoc-signing the single published file wasn't enough, since
    # the native libraries it unpacks don't exist as files until runtime,
    # after that signature was already applied). Publishing as a normal
    # self-contained folder for macOS means every native library sits on
    # disk from publish time onward, where the next step can sign it too.
    - name: Publish Application (${{ matrix.rid }})
      run: |
        dotnet publish $env:Solution_Name `
          -c Release `
          -r ${{ matrix.rid }} `
          --self-contained true `
          -p:PublishSingleFile=${{ matrix.singleFile }} `
          -p:IncludeNativeLibrariesForSelfExtract=${{ matrix.singleFile }} `
          -p:EnableCompressionInSingleFile=${{ matrix.singleFile }} `
          -p:BuildNumber=${{ github.run_number }} `
          -o ./publish/${{ matrix.rid }}

    # ZIP/copy steps below don't reliably preserve the Unix executable bit across
    # platforms, so the binary is (re-)marked executable at each point it's used.
    - name: Mark binary executable (Linux/macOS)
      if: runner.os == 'Linux' || runner.os == 'macOS'
      shell: bash
      run: chmod +x ./publish/${{ matrix.rid }}/${{ matrix.exeName }}

    # Native Apple Silicon (arm64) requires at least an ad-hoc code signature
    # for the kernel to load and run any Mach-O binary - the main executable
    # AND every native library it loads (Skia/HarfBuzz etc., bundled by
    # Avalonia as loose .dylib files now that macOS isn't single-file - see
    # the "Publish Application" step's comment). --deep on the exe alone only
    # reaches content nested *inside* it (e.g. an app bundle); it does not
    # reach sibling files in a plain folder, so each .dylib is signed too.
    - name: Ad-hoc code-sign (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        codesign --sign - --force --deep ./publish/${{ matrix.rid }}/${{ matrix.exeName }}
        find ./publish/${{ matrix.rid }} -name "*.dylib" -exec codesign --sign - --force {} \;

    # Headless smoke-test: the only real proof (in this whole project) that the
    # Linux dependency-download logic actually works, since local development
    # happens on Windows. linux-x64 only: ubuntu-latest is an x86-64 runner and
    # cannot execute an aarch64 binary without QEMU/binfmt_misc registration,
    # which this workflow does not set up. The app downloads its tools into the
    # per-user data directory (~/.local/share/YouTubeDownloader), never next to
    # the exe - the test asserts both. Runs against a copy in an isolated temp
    # directory so nothing the app writes can end up in the release artifact.
    - name: Smoke-test published binary (linux-x64 only)
      if: matrix.rid == 'linux-x64'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libx11-6 libice6 libsm6 fontconfig fonts-dejavu-core
        SMOKE="$RUNNER_TEMP/smoke"
        mkdir -p "$SMOKE"
        DATA_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/YouTubeDownloader"
        cp ./publish/${{ matrix.rid }}/${{ matrix.exeName }} "$SMOKE/"
        chmod +x "$SMOKE/${{ matrix.exeName }}"
        xvfb-run --auto-servernum "$SMOKE/${{ matrix.exeName }}" > "$SMOKE/app.log" 2>&1 &
        APP_PID=$!
        sleep 60
        if kill -0 $APP_PID 2>/dev/null; then
          echo "App is running (PID $APP_PID) after 60s"
        else
          echo "App failed to start or crashed"
          cat "$SMOKE/app.log"
          exit 1
        fi
        if [ -x "$DATA_DIR/yt-dlp" ] && [ -x "$DATA_DIR/ffmpeg_bin/ffmpeg" ] && [ ! -e "$SMOKE/yt-dlp" ]; then
          echo "yt-dlp and ffmpeg were downloaded to $DATA_DIR and are executable - Linux dependency logic verified"
        else
          echo "App is running, but yt-dlp/ffmpeg are not in $DATA_DIR (or were written next to the exe)"
          ls -la "$SMOKE" "$DATA_DIR" "$DATA_DIR/ffmpeg_bin" 2>&1
          cat "$SMOKE/app.log"
          pkill -f "$SMOKE/${{ matrix.exeName }}" || true
          exit 1
        fi
        pkill -f "$SMOKE/${{ matrix.exeName }}" || true
        kill $APP_PID 2>/dev/null || true
        rm -rf "$SMOKE"

    # osx-x64 runs on the ARM64 macos-latest runner via Rosetta 2, which is not
    # preinstalled - it must be explicitly installed before the smoke-test step
    # below can execute the x64 binary. Not needed for osx-arm64 (runs natively)
    # or for the publish step above (a pure cross-compile, independent of host arch).
    - name: Install Rosetta (osx-x64 on ARM64 runner)
      if: matrix.rid == 'osx-x64'
      shell: bash
      run: sudo softwareupdate --install-rosetta --agree-to-license

    # Headless smoke-test: the only real proof (in this whole project) that the
    # macOS dependency-download logic actually works, since local development
    # happens on Windows. The app downloads its tools into the per-user data
    # directory (~/Library/Application Support/YouTubeDownloader), never next to
    # the exe - the test asserts both. Runs for both osx-x64 (via Rosetta,
    # installed above) and osx-arm64 (native) - both are runner.os == 'macOS'.
    - name: Smoke-test published binary (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        SMOKE="$RUNNER_TEMP/smoke"
        mkdir -p "$SMOKE"
        DATA_DIR="$HOME/Library/Application Support/YouTubeDownloader"
        # Copy the whole publish folder, not just the exe: macOS is no
        # longer single-file (see "Publish Application"), so the exe needs
        # its sibling native libraries alongside it to run at all.
        cp -R ./publish/${{ matrix.rid }}/. "$SMOKE/"
        chmod +x "$SMOKE/${{ matrix.exeName }}"
        "$SMOKE/${{ matrix.exeName }}" > "$SMOKE/app.log" 2>&1 &
        APP_PID=$!
        sleep 60
        if kill -0 $APP_PID 2>/dev/null; then
          echo "App is running (PID $APP_PID) after 60s"
        else
          echo "App failed to start or crashed"
          cat "$SMOKE/app.log"
          exit 1
        fi
        if [ -x "$DATA_DIR/yt-dlp" ] && [ -x "$DATA_DIR/ffmpeg_bin/ffmpeg" ] && [ -x "$DATA_DIR/ffmpeg_bin/ffprobe" ] && [ ! -e "$SMOKE/yt-dlp" ]; then
          echo "yt-dlp and ffmpeg/ffprobe were downloaded to $DATA_DIR and are executable - macOS dependency logic verified"
        else
          echo "App is running, but yt-dlp/ffmpeg are not in $DATA_DIR (or were written next to the exe)"
          ls -la "$SMOKE" "$DATA_DIR" "$DATA_DIR/ffmpeg_bin" 2>&1
          cat "$SMOKE/app.log"
          pkill -f "$SMOKE/${{ matrix.exeName }}" || true
          exit 1
        fi
        pkill -f "$SMOKE/${{ matrix.exeName }}" || true
        kill $APP_PID 2>/dev/null || true
        rm -rf "$SMOKE"

    # Package publish folder - create zip of the publish folder
    - name: Package publish folder
      run: Compress-Archive -Path ./publish/${{ matrix.rid }}/* -DestinationPath ./publish/${{ matrix.rid }}/YouTubeDownloader-${{ matrix.rid }}.zip -Force

    # Verify publish output
    - name: Verify publish output
      run: dir ./publish/${{ matrix.rid }}

    # Upload build artifacts. Skipped for macOS: it's no longer single-file
    # (see "Publish Application"), so the bare exe alone is not a complete,
    # runnable artifact there - "Upload Full Release Package" below already
    # covers macOS with the whole publish folder.
    - name: Upload Release Artifacts
      if: runner.os != 'macOS'
      uses: actions/upload-artifact@v7
      with:
        name: YouTubeDownloader-${{ matrix.rid }}
        path: ./publish/${{ matrix.rid }}/${{ matrix.exeName }}
        if-no-files-found: error

    # Upload all published files as artifact
    - name: Upload Full Release Package
      uses: actions/upload-artifact@v7
      with:
        name: YouTubeDownloader-${{ matrix.rid }}-full-package
        path: ./publish/${{ matrix.rid }}/
        if-no-files-found: error

    # GitHub release assets must have unique file names across the whole release,
    # so give the per-RID exe a distinct name before attaching it. Skipped for
    # macOS: there's no standalone exe asset to prepare (see "Upload Release
    # Artifacts" above) - the zip from "Package publish folder", already
    # uniquely named per RID, is macOS's only release asset.
    - name: Prepare release asset names
      if: runner.os != 'macOS'
      run: Copy-Item ./publish/${{ matrix.rid }}/${{ matrix.exeName }} ./publish/${{ matrix.rid }}/${{ matrix.releaseExeName }}

    - name: Mark release asset executable (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: chmod +x ./publish/${{ matrix.rid }}/${{ matrix.releaseExeName }}

    # Create/update a GitHub Release and upload the exe and zip as release assets
    # Note: actions/create-release and actions/upload-release-asset are archived/unmaintained,
    # replaced with softprops/action-gh-release which covers both in one step.
    - name: Create Release (Windows/Linux)
      if: runner.os != 'macOS'
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.get_version.outputs.version }}-${{ github.run_number }}
        name: v${{ steps.get_version.outputs.version }} (build ${{ github.run_number }})
        body: Automated release for version ${{ steps.get_version.outputs.version }}, run ${{ github.run_id }} (commit ${{ github.sha }})
        draft: false
        prerelease: false
        files: |
          ./publish/${{ matrix.rid }}/${{ matrix.releaseExeName }}
          ./publish/${{ matrix.rid }}/YouTubeDownloader-${{ matrix.rid }}.zip

    # macOS isn't single-file (see "Publish Application"), so only the zip -
    # the whole publish folder, with its native libraries alongside the exe -
    # is a valid, runnable release asset; there is no standalone exe to attach.
    - name: Create Release (macOS)
      if: runner.os == 'macOS'
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.get_version.outputs.version }}-${{ github.run_number }}
        name: v${{ steps.get_version.outputs.version }} (build ${{ github.run_number }})
        body: Automated release for version ${{ steps.get_version.outputs.version }}, run ${{ github.run_id }} (commit ${{ github.sha }})
        draft: false
        prerelease: false
        files: |
          ./publish/${{ matrix.rid }}/YouTubeDownloader-${{ matrix.rid }}.zip
