# TEMPORARY - delete before merging. Builds this branch (same publish flags as
# the release workflow) natively on both Linux architectures, runs the unit
# tests and the plain smoke test, packs and smoke-tests the AppImage, and
# cross-builds the other architecture through build.sh. Never publishes; the
# AppImages are kept as workflow artifacts for a manual test on a desktop.
name: AppImage verify from source (temporary)

on:
  push:
    branches: [ "claude/appimage" ]

permissions:
  contents: read

jobs:
  appimage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
            other: arm64
            otherElf: aarch64
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            other: x64
            otherElf: x86-64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Install .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    # The publish job runs its steps in pwsh - linux-arm64 moves to
    # ubuntu-24.04-arm, so pwsh must exist there too.
    - name: pwsh is available
      shell: pwsh
      run: |
        $PSVersionTable.PSVersion
        $ver = dotnet msbuild YouTubeDownloader.csproj -getProperty:Version
        echo "version=$ver"

    - name: Unit tests
      run: dotnet test tests/YouTubeDownloader.Tests/YouTubeDownloader.Tests.csproj -c Release

    - name: Publish this branch's single-file binary
      run: |
        dotnet publish YouTubeDownloader.csproj -c Release -r ${{ matrix.rid }} --self-contained true \
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
          -p:EnableCompressionInSingleFile=true -o ./publish/${{ matrix.rid }}
        chmod +x ./publish/${{ matrix.rid }}/YouTubeDownloader

    # Copy of the release workflow's plain smoke test, which now runs on both legs.
    - name: Smoke-test published binary
      env:
        YTD_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libx11-6 libice6 libsm6 fontconfig fonts-dejavu-core
        SMOKE="$RUNNER_TEMP/smoke"
        mkdir -p "$SMOKE"
        # Exercise embedded Inter and DejaVu Sans Mono without system fonts.
        mkdir -p "$SMOKE/empty-fonts" "$SMOKE/font-cache"
        export FONTCONFIG_FILE="$SMOKE/fonts.conf"
        cat > "$FONTCONFIG_FILE" <<EOF
        <?xml version="1.0"?>
        <!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
        <fontconfig>
          <dir>$SMOKE/empty-fonts</dir>
          <cachedir>$SMOKE/font-cache</cachedir>
        </fontconfig>
        EOF
        test -z "$(fc-list)"
        DATA_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/YouTubeDownloader"
        cp ./publish/${{ matrix.rid }}/YouTubeDownloader "$SMOKE/"
        chmod +x "$SMOKE/YouTubeDownloader"
        xvfb-run --auto-servernum "$SMOKE/YouTubeDownloader" > "$SMOKE/app.log" 2>&1 &
        APP_PID=$!
        for i in $(seq 1 36); do
          sleep 5
          kill -0 $APP_PID 2>/dev/null || break
          if [ -x "$DATA_DIR/yt-dlp" ] && [ -x "$DATA_DIR/ffmpeg_bin/ffmpeg" ] && [ -x "$DATA_DIR/ffmpeg_bin/ffprobe" ] &&
             grep -Eq '\[status\] (All components are available|Wszystkie komponenty są dostępne)' "$SMOKE/app.log"; then break; fi
        done
        if kill -0 $APP_PID 2>/dev/null; then
          echo "App is running (PID $APP_PID) after $((i * 5))s"
        else
          echo "App failed to start or crashed"
          cat "$SMOKE/app.log"
          exit 1
        fi
        if [ -x "$DATA_DIR/yt-dlp" ] && [ -x "$DATA_DIR/ffmpeg_bin/ffmpeg" ] && [ -x "$DATA_DIR/ffmpeg_bin/ffprobe" ] && [ ! -e "$SMOKE/yt-dlp" ] &&
           grep -Eq '\[status\] (All components are available|Wszystkie komponenty są dostępne)' "$SMOKE/app.log"; then
          echo "The app verified all components in $DATA_DIR - Linux dependency logic verified"
        else
          echo "The app did not verify its components in $DATA_DIR (or wrote tools next to the exe)"
          ls -la "$SMOKE" "$DATA_DIR" "$DATA_DIR/ffmpeg_bin" 2>&1
          cat "$SMOKE/app.log"
          pkill -f "$SMOKE/YouTubeDownloader" || true
          exit 1
        fi
        pkill -f "$SMOKE/YouTubeDownloader" || true
        kill $APP_PID 2>/dev/null || true
        rm -rf "$SMOKE"

    - name: Build AppImage
      run: |
        version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' YouTubeDownloader.csproj)
        bash appimage/package.sh ./publish/${{ matrix.rid }}/YouTubeDownloader ./dist/${{ matrix.rid }} \
          ${{ matrix.rid }} "$version-${{ github.run_number }}"

    - name: Smoke-test AppImage
      env:
        YTD_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: bash appimage/smoke-test.sh ./dist/${{ matrix.rid }}/YouTubeDownloader-${{ matrix.rid }}.AppImage

    # build.sh and the cross-architecture claim: this host packs the other arch.
    - name: build.sh appimage-${{ matrix.other }} (cross-architecture)
      run: |
        ./build.sh appimage-${{ matrix.other }}
        f=publish/appimage-${{ matrix.other }}/YouTubeDownloader-linux-${{ matrix.other }}.AppImage
        test -x "$f"
        file "$f"
        file "$f" | grep -q "${{ matrix.otherElf }}"

    - name: Keep the AppImage for a manual test
      uses: actions/upload-artifact@v7
      with:
        name: YouTubeDownloader-${{ matrix.rid }}.AppImage
        path: ./dist/${{ matrix.rid }}/YouTubeDownloader-${{ matrix.rid }}.AppImage
        if-no-files-found: error
