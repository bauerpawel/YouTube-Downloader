# TEMPORARY - delete before merging. Runs the linux-startup job's steps from
# this branch (the release workflow only runs it on pull requests and main),
# the unit tests on Linux, and checks the APPDIR name an extract-and-run start
# gets (AppPaths.IsExtractAndRunDirectory relies on it). Never publishes.
name: AppImage verify from source (temporary)

on:
  push:
    branches: [ "claude/appimage" ]

permissions:
  contents: read

jobs:
  linux-startup:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Unit tests
      run: dotnet test tests/YouTubeDownloader.Tests/YouTubeDownloader.Tests.csproj -c Release
    - name: Publish Linux test application
      run: |
        dotnet publish YouTubeDownloader.csproj -c Release -r ${{ matrix.rid }} --self-contained true \
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
          -p:EnableCompressionInSingleFile=true -o ./startup-publish
    - name: Build AppImage
      run: |
        version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' YouTubeDownloader.csproj)
        bash appimage/package.sh ./startup-publish/YouTubeDownloader ./startup-dist ${{ matrix.rid }} "$version-${{ github.run_number }}"
    - name: Smoke-test AppImage
      env:
        YTD_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: bash appimage/smoke-test.sh ./startup-dist/YouTubeDownloader-${{ matrix.rid }}.AppImage
    - name: APPDIR of an --appimage-extract-and-run start
      run: |
        Xvfb -displayfd 3 -screen 0 1280x1024x24 -ac 3> "$RUNNER_TEMP/display" > /dev/null 2>&1 &
        for i in $(seq 1 20); do [ -s "$RUNNER_TEMP/display" ] && break; sleep 0.5; done
        export DISPLAY=":$(head -n 1 "$RUNNER_TEMP/display")"
        export XDG_DATA_HOME="$RUNNER_TEMP/extract-data"
        ./startup-dist/YouTubeDownloader-${{ matrix.rid }}.AppImage --appimage-extract-and-run > "$RUNNER_TEMP/extract.log" 2>&1 &
        PID=$!
        appdir=""
        for i in $(seq 1 30); do
          appdir=$(tr '\0' '\n' < "/proc/$PID/environ" 2>/dev/null | sed -n 's/^APPDIR=//p')
          [ -n "$appdir" ] && break
          sleep 1
        done
        echo "APPDIR=$appdir"
        cat "$RUNNER_TEMP/extract.log"
        kill "$PID" 2>/dev/null || true
        case "$(basename "$appdir")" in
          appimage_extracted_*) echo "extract-and-run APPDIR matches AppPaths.IsExtractAndRunDirectory" ;;
          *) echo "unexpected APPDIR '$appdir'"; exit 1 ;;
        esac
